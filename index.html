    <script>
      // Filter out benign Vite HMR websocket reconnection noise in dev container
      (function() {
        const origWarn = console.warn;
        const origError = console.error;
        const origLog = console.log;
        const isViteNoise = (msg) => {
          if (!msg) return false;
          const str = String(msg);
          return str.includes('[vite]') || str.includes('WebSocket') || str.includes('vite-hmr') || str.includes('failed to connect to websocket');
        };
        console.warn = function(...args) {
          if (args.some(isViteNoise)) return;
          origWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (args.some(isViteNoise)) return;
          origError.apply(console, args);
        };
        console.log = function(...args) {
          if (args.some(isViteNoise)) return;
          origLog.apply(console, args);
        };
      })();
    </script>
